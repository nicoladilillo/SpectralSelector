name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not remote_data" --cov=spectralselector --cov-report=term-missing --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests examples benchmarks scripts docs/conf.py
      - run: python -m ruff check src tests examples benchmarks scripts docs/conf.py
      - run: codespell .
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv /tmp/spectralselector-wheel-smoke
          /tmp/spectralselector-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/spectralselector-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/spectralselector-wheel-smoke/bin/python -c "import spectralselector; from spectralselector import IndexSelector, PLSDA; assert spectralselector.__version__ != '0+unknown'; assert IndexSelector([0]).fit_transform([[1., 2.], [3., 4.]]).shape == (2, 1); assert PLSDA().get_params()['n_components'] == 2"
      - name: Test the built source distribution in a clean environment
        run: |
          python -m venv /tmp/spectralselector-sdist-smoke
          /tmp/spectralselector-sdist-smoke/bin/python -m pip install --upgrade pip
          /tmp/spectralselector-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/spectralselector-sdist-smoke/bin/python -c "import spectralselector; from spectralselector import FCovSelSelector; assert spectralselector.__version__ != '0+unknown'; assert FCovSelSelector.__name__ == 'FCovSelSelector'"

  determinism:
    name: Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -m determinism

  remote-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m remote_data tests/test_datasets.py
