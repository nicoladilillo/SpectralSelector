name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify release metadata
        run: python scripts/check_release_metadata.py --tag "${{ github.ref_name }}"
      - run: python -m ruff format --check src tests examples benchmarks scripts docs/conf.py
      - run: python -m ruff check src tests examples benchmarks scripts docs/conf.py
      - run: codespell .
      - run: python -m pytest -m "not remote_data" --cov=spectralselector
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv /tmp/spectralselector-release-wheel-smoke
          /tmp/spectralselector-release-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/spectralselector-release-wheel-smoke/bin/python -c "import spectralselector; assert spectralselector.__version__ != '0+unknown'"
      - name: Test the built source distribution in a clean environment
        run: |
          python -m venv /tmp/spectralselector-release-sdist-smoke
          /tmp/spectralselector-release-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          /tmp/spectralselector-release-sdist-smoke/bin/python -c "import spectralselector; assert spectralselector.__version__ != '0+unknown'"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > ../SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-checksums
          path: SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spectralselector
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-release-assets:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: python-package-checksums
      - name: Attach distributions and checksums to the GitHub release
        run: gh release upload "${{ github.ref_name }}" dist/* SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
