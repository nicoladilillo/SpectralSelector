name: Bug report
description: Report reproducible incorrect behavior in SpectralSelector
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve SpectralSelector.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small runnable example without confidential data.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpectralSelector version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, NumPy, SciPy, and scikit-learn versions.
    validations:
      required: true
  - type: dropdown
    id: task
    attributes:
      label: Task type
      options:
        - Regression
        - Classification
        - Unsupervised or transform only
        - Not applicable
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private or restricted data from the reproduction.
          required: true
