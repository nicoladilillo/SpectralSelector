repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: codespell
        name: Spelling
        entry: codespell
        language: system
        types: [text]
      - id: pytest
        name: Unit tests
        entry: python -m pytest -q -m "not remote_data"
        language: system
        pass_filenames: false
        stages: [pre-push]
