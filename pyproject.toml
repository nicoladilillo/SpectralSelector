[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "spectralselector"
version = "0.1.0"
description = "Scikit-learn-compatible wavelength selection for spectroscopy and chemometrics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Nicola Dilillo"}]
maintainers = [{name = "Nicola Dilillo"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
]
keywords = [
  "chemometrics",
  "spectroscopy",
  "variable-selection",
  "wavelength-selection",
  "scikit-learn",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.6",
  "tqdm>=4.66",
]

[project.urls]
Documentation = "https://spectralselector.readthedocs.io"
Issues = "https://github.com/nicoladilillo/spectralselector/issues"
Repository = "https://github.com/nicoladilillo/spectralselector"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
chemotools = ["chemotools>=0.4.3", "pandas>=2.1"]
test = [
  "chemotools>=0.4.3",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pytest>=8",
  "pytest-cov>=5",
]
docs = [
  "myst-parser>=4",
  "pydata-sphinx-theme>=0.16",
  "sphinx>=8",
]
dev = [
  "build>=1.2",
  "chemotools>=0.4.3",
  "codespell>=2.4",
  "matplotlib>=3.8",
  "myst-parser>=4",
  "pandas>=2.1",
  "pip-tools>=7.5",
  "pre-commit>=4",
  "pydata-sphinx-theme>=0.16",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
  "sphinx>=8",
  "twine>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spectralselector"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/LICENSE",
  "/README.md",
  "/.pre-commit-config.yaml",
  "/assets",
  "/benchmarks",
  "/docs",
  "/environment.yml",
  "/examples",
  "/paper",
  "/pyproject.toml",
  "/requirements-dev.lock",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "determinism: fixed-seed checks run on every supported operating system",
  "remote_data: tests that download public source datasets",
]

[tool.coverage.run]
branch = true
source = ["spectralselector"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["benchmarks/results*", "docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.codespell]
skip = "./docs/_build/*,./benchmarks/results*,*.lock,*.svg"
ignore-words-list = "nd,te,fo,als,ot"
